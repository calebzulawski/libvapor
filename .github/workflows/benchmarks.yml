name: Benchmarks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install benchmark dependencies
        run: python -m pip install -r benches/requirements.txt
      - name: Run benchmarks and generate plots
        run: python benches/run.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.os }}
          path: |
            target/benchmarks/*.json
            target/benchmarks/*.jsonl
            target/benchmarks/*.csv
            target/benchmarks/*.png
            target/benchmarks/*.svg
          if-no-files-found: error
