name: Benchmarks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install benchmark dependencies
        run: python -m pip install -r benches/requirements.txt
      - name: Run benchmarks and generate plots
        run: python benches/run.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.os }}
          path: |
            target/benchmarks/*.json
            target/benchmarks/*.jsonl
            target/benchmarks/*.csv
            target/benchmarks/*.png
            target/benchmarks/*.svg
          if-no-files-found: error

  publish:
    name: Publish benchmark charts
    needs: benchmark
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmarks-*
          path: target/benchmark-artifacts
      - name: Collect benchmark PNGs
        run: |
          mkdir -p target/benchmark-site/benchmarks
          for runner in ubuntu-24.04 ubuntu-24.04-arm macos-15; do
            cp "target/benchmark-artifacts/benchmarks-$runner/speedup.png" \
              "target/benchmark-site/benchmarks/$runner.png"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/benchmark-site
      - name: Deploy benchmark PNGs
        id: deployment
        uses: actions/deploy-pages@v5
