[package]
name = "mwise"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
members = ["tools"]
default-members = ["."]
resolver = "2"

[features]
# Use software math implementations even when the target supports hardware math.
force-soft = []

[dev-dependencies]
mwise-tools = { path = "tools", default-features = false }
paste = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
