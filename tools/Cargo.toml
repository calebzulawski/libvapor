[package]
name = "libvapor-tools"
version = "0.1.0"
edition = "2021"
publish = false

[features]
oracle = ["dep:rug"]

[dependencies]
rug = { version = "1.30", optional = true, default-features = false, features = ["float", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vapor = { package = "libvapor", path = ".." }
paste = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

[[bin]]
name = "generate-fixtures"
path = "src/bin/generate_fixtures.rs"
test = false
bench = false
required-features = ["oracle"]

[[test]]
name = "transcendental_live"
required-features = ["oracle"]

[[bin]]
name = "generate-log-centers"
path = "src/bin/generate_log_centers.rs"
test = false
bench = false
required-features = ["oracle"]
